syntax = "proto3";

package swipt.android;
option go_package = "github.com/swipt-automation/swipt/internal/android/proto";
option java_package = "io.nekohasekai.swipt.proto";
option java_multiple_files = true;

import "google/protobuf/empty.proto";

service SystemService {
  rpc GetInfo(google.protobuf.Empty) returns (GetInfoResponse);
  rpc WatchAlerts(google.protobuf.Empty) returns (stream Alert);
  rpc GetCacheSize(google.protobuf.Empty) returns (GetCacheSizeResponse);
  rpc ClearCaches(google.protobuf.Empty) returns (google.protobuf.Empty);
}

message GetInfoResponse {
  string device_name = 1;
}

message RecordingFailure {
  string message = 1;
}

message Alert {
  oneof kind {
    RecordingFailure recording_failure = 1;
  }
}

message GetCacheSizeResponse {
  int64 bytes = 1;
}
