syntax = "proto3";

package swipt;
option go_package = "github.com/swipt-automation/swipt/internal/proto";

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "common.proto";

service SwipletService {
  rpc ListSwiplets(google.protobuf.Empty) returns (ListSwipletsResponse);
  rpc CallAction(CallActionRequest) returns (stream CallActionResponse);
  rpc SetServiceEnabled(SetServiceEnabledRequest) returns (SetServiceEnabledResponse);
  rpc WatchServices(WatchServicesRequest) returns (stream WatchServicesResponse);
  rpc DeploySwiplet(stream DeploySwipletRequest) returns (DeploySwipletResponse);
  rpc RemoveSwiplet(RemoveSwipletRequest) returns (google.protobuf.Empty);
  rpc ListDataFiles(ListDataFilesRequest) returns (ListDataFilesResponse);
  rpc ReadDataFile(ReadDataFileRequest) returns (stream ReadDataFileResponse);
  rpc WriteDataFile(stream WriteDataFileRequest) returns (WriteDataFileResponse);
  rpc RemoveDataFile(RemoveDataFileRequest) returns (google.protobuf.Empty);
}

message SwipletAction {
  string name = 1;
  string title = 2;
  string description = 3;
  bool exposed_to_shortcuts = 4;
  google.protobuf.Struct input_schema = 5;
  google.protobuf.Struct output_schema = 6;
}

enum ServiceStatus {
  SERVICE_STATUS_UNSPECIFIED = 0;
  SERVICE_STATUS_STOPPED = 1;
  SERVICE_STATUS_STARTING = 2;
  SERVICE_STATUS_RUNNING = 3;
  SERVICE_STATUS_FAILED = 4;
}

message ServiceState {
  bool enabled = 1;
  ServiceStatus status = 2;
  ScriptError error = 3;
  google.protobuf.Timestamp since = 4;
}

message Swiplet {
  string id = 1;
  string title = 2;
  string version = 3;
  bool has_service = 5;
  ServiceState service = 6;
  repeated SwipletAction actions = 7;
}

message ListSwipletsResponse {
  repeated Swiplet swiplets = 1;
}

message CallActionRequest {
  string swiplet_id = 1;
  string action = 2;
  google.protobuf.Value input = 3;
}

message CallActionResponse {
  oneof part {
    LogEntry log = 1;
    ActionResult result = 2;
  }
}

message SetServiceEnabledRequest {
  string swiplet_id = 1;
  bool enabled = 2;
}

message SetServiceEnabledResponse {
  ServiceState service = 1;
}

message WatchServicesRequest {
  string swiplet_id = 1;
}

message WatchServicesResponse {
  string swiplet_id = 1;
  ServiceState service = 2;
}

message DeploySwipletRequest {
  bytes chunk = 1;
}

message DeploySwipletResponse {
  Swiplet swiplet = 1;
  bool replaced = 2;
}

message RemoveSwipletRequest {
  string swiplet_id = 1;
}

message ListDataFilesRequest {
  string swiplet_id = 1;
  string path = 2;
  bool recursive = 3;
}

message ListDataFilesResponse {
  repeated FileInfo files = 1;
}

message ReadDataFileRequest {
  string swiplet_id = 1;
  string path = 2;
}

message ReadDataFileResponse {
  oneof part {
    FileInfo file = 1;
    FileChunk chunk = 2;
  }
}

message WriteDataFileHeader {
  string swiplet_id = 1;
  string path = 2;
}

message WriteDataFileRequest {
  oneof part {
    WriteDataFileHeader header = 1;
    bytes data = 2;
  }
}

message WriteDataFileResponse {
  FileInfo file = 1;
}

message RemoveDataFileRequest {
  string swiplet_id = 1;
  string path = 2;
  bool recursive = 3;
}
