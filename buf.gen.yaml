version: v2
plugins:
  - local: [go, tool, protoc-gen-go]
    out: internal/proto
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-go-grpc]
    out: internal/proto
    opt: paths=source_relative
  - local: node_modules/.bin/protoc-gen-es
    out: cli/src/proto
    opt:
      - target=js
      - import_extension=.js
